<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/responsive.css">
    <link rel="icon" type="image/png" href="./img_pollo_locco/img/2_character_pepe/1_idle/idle/I-10.png">
    <title>El Pollo Loco</title>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/base-chicken.class.js"></script>
     <script src="./models/chicken.class.js"></script>
    <script src="./models/small-chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/world-core.class.js"></script>
    <script src="./models/world-combat.class.js"></script>
    <script src="./models/world-collectables.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/world-renderer.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/base-endboss.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/modal-templates.js"></script>
    <script src="./js/audio-manager.js"></script>
    <script src="./js/game/game-input.controller.js"></script>
    <script src="./js/game/game-ui.controller.js"></script>
    <script src="./js/game/game-viewport.controller.js"></script>
    <script src="./js/game/game-app.class.js"></script>
    <script src="./js/game.js"></script>

</head>
<body> 
    <div class="page">
        <div id="game-area">
            <canvas id="canvas" width="720" height="480"></canvas>
            <button class="btn ghost mute-toggle mute-floating" type="button">Sound: An</button>
            <section class="rotate-overlay hidden" id="rotate-overlay">
                <div class="rotate-card">
                    <h2>Bitte drehen</h2>
                    <p>Halte dein Gerät quer, um spielen zu können.</p>
                </div>
            </section>
            <section class="landing-overlay" id="landing">
                <div class="landing-card">
                    <h1>El Pollo Loco</h1>
                    <p>Hilf Pepe durch die Wüste und besiege den Endboss.</p>
                    <div class="landing-actions">
                        <button class="btn primary" onclick="startGame()">Spiel starten</button>
                        <button class="btn" onclick="openModal('how')">So geht's</button>
                        <button class="btn" onclick="openModal('controls')">Tasten</button>
                        <button class="btn ghost" onclick="openModal('story')">Story</button>
                        <button class="btn ghost" onclick="openModal('impressum')">Impressum</button>
                        <button class="btn ghost" onclick="toggleFullscreen()">Fullscreen</button>
                    </div>
                </div>
            </section>
            <section class="end-overlay hidden" id="endscreen">
                <div class="end-card">
                    <h2 id="end-title">Game Over</h2>
                    <p id="end-text">Du hast verloren. Versuch es nochmal!</p>
                    <div class="end-actions">
                        <button class="btn primary" onclick="restartGame()">Restart</button>
                        <button class="btn ghost" onclick="backToHome()">Home</button>
                    </div>
                </div>
            </section>
            <div class="mobile-controls" id="mobile-controls">
                <div class="mobile-controls-row">
                    <button class="mobile-btn" data-action="left">◀</button>
                    <button class="mobile-btn" data-action="right">▶</button>
                </div>
                <div class="mobile-controls-row">
                    <button class="mobile-btn" data-action="jump">⤒</button>
                    <button class="mobile-btn" data-action="throw">🧴</button>
                </div>
            </div>
        </div>
    </div>
    <audio id="bg-music" src="./audio/BG-Music.mp3" loop></audio>
    <audio id="game-music" src="./audio/desert-insects-52089.mp3" loop></audio>
    <audio id="pepe-jump" src="./audio/pepe_jump.wav"></audio>
    <audio id="pepe-hurt" src="./audio/pepe_hurt.wav"></audio>
    <audio id="bottle-throw" src="./audio/bottle_throw.wav"></audio>
    <audio id="bottle-hit" src="./audio/hit bottle.mp3"></audio>
    <audio id="coin_insert" src="./audio/coin_insert.mp3"></audio>
    <audio id="retract_bottles" src="./audio/retract_bottles.mp3"></audio>
    <audio id="win" src="./audio/win.mp3"></audio>
    <audio id="game-over" src="./audio/game_over.mp3"></audio>

    <div class="modal hidden" id="info-modal" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" aria-label="Dialog schließen" onclick="closeModal()">×</button>
            <h2 id="modal-title">Info</h2>
            <div class="modal-content" id="modal-content"></div>
        </div>
    </div>
</body>


</html>
